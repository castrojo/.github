name: Bug report
description: Report a bug or unexpected behavior in this repository
title: "[bug] <short description>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check existing
        issues in this repository before filing.

        If your issue is specific to the TunaOS operating system image (desktop
        variants, system ISOs, or OS image builds), please file it in
        [tuna-os/tunaos](https://github.com/tuna-os/tunaos/issues).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug. Include what you expected to happen instead.
      placeholder: "Tell us what went wrong..."
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Run...
        2. Execute...
        3. See error...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, version/commit/tag, hardware, or runtime dependencies relevant to this repository
      placeholder: "e.g. OS version, package/release version, architecture, browser/runtime..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / error output
      description: Paste any terminal output, logs, or screenshots
      render: shell
