name: Feature request
description: Suggest an idea or enhancement for this repository
title: "[enhancement] <short description>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an idea! Please check existing issues and the
        repository's roadmap or documentation before filing.

        If your suggestion is for the overall TunaOS operating system image,
        please file it in [tuna-os/tunaos](https://github.com/tuna-os/tunaos/issues).
  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What gap, limitation, or pain point does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to see happen
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or implementations you considered
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Are you interested in implementing this?
      options:
        - label: "Yes — I'd like to work on this (would you like a good-first-issue tag?)"
