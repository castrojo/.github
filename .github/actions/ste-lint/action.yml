name: "Simplified Technical English lint"
description: >-
  Checks Markdown prose against ASD-STE100 (sentence length, active voice,
  -ing forms, approved words, noun clusters, paragraph length) with a
  per-repo budget so conformance can be converted file by file instead of
  demanded on day one. Originally built in tuna-os/docs; the linter and its
  rules travel with this action so no repository carries a copy to drift.

inputs:
  budget-file:
    description: >-
      File holding the maximum number of findings this repo tolerates. The
      number only ever goes down; lower it whenever a batch of prose lands.
    required: false
    default: .ste-budget
  budget:
    description: >-
      Budget to use when budget-file does not exist. Seeding a repo means
      running the linter once and committing its current count -- a gate
      that fails on day one gets disabled on day two.
    required: false
    default: ""
  node-version:
    required: false
    default: "24"
  run-tests:
    description: >-
      Run the linter's own rule tests first. About half of them assert what
      must NOT be reported, because a checker that flags correct prose gets
      switched off, and then nothing is checked at all.
    required: false
    default: "true"
  base-ref:
    description: >-
      Branch to diff against for the advisory per-PR report (the reusable
      workflow passes github.base_ref). Empty disables it. The budget gate
      always runs; this only adds hints — file:line findings and inline
      annotations for what the branch itself introduced.
    required: false
    default: ""
  annotations:
    description: >-
      Emit ::warning annotations for the branch's new findings so they render
      inline on the PR. The gate still decides pass/fail; hints never do.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Rule tests
      if: inputs.run-tests == 'true'
      shell: bash
      # Run from the workspace, not the action directory: the suite's
      # generated-tree tests resolve scripts/sync-org-docs.mjs relative to the
      # repository being checked, and announce themselves as skipped when it
      # is not there.
      run: node "$GITHUB_ACTION_PATH/ste-lint.test.mjs"

    - name: STE budget
      shell: bash
      env:
        BUDGET_FILE: ${{ inputs.budget-file }}
        BUDGET_INPUT: ${{ inputs.budget }}
        BASE_REF: ${{ inputs.base-ref }}
        ANNOTATIONS: ${{ inputs.annotations }}
      run: |
        set -euo pipefail
        if [ -f "$BUDGET_FILE" ]; then
          budget=$(cat "$BUDGET_FILE")
        elif [ -n "$BUDGET_INPUT" ]; then
          budget="$BUDGET_INPUT"
        else
          echo "::error::No $BUDGET_FILE and no 'budget' input. Seed this repo first:"
          echo "::error::  node <action>/ste-lint.mjs --summary   # count, then commit it as $BUDGET_FILE"
          exit 1
        fi
        echo "STE budget: ${budget}"
        # --summary prints the per-file counts, the opt-outs with their stated
        # reasons, and which trees were treated as generated. Printing it on
        # every run is what makes a tree entering or leaving the budget visible
        # in the log rather than only in the total.
        node "$GITHUB_ACTION_PATH/ste-lint.mjs" --summary
        # The gate stays quiet on success, but a bare "251 > 247" tells the
        # author nothing about what to fix — so on failure the full detail
        # (file:line, rule, replacement) follows the verdict. A hint that only
        # exists behind >/dev/null helps nobody.
        if ! node "$GITHUB_ACTION_PATH/ste-lint.mjs" --max "$budget" >"$RUNNER_TEMP/ste-detail.txt" 2>&1; then
          cat "$RUNNER_TEMP/ste-detail.txt"
          echo "::error::STE budget exceeded. Fix the findings above (file:line, with the approved replacement where the rule names one), or move the prose behind an opt-out with a stated reason. Reproduce locally: just ste"
          exit 1
        fi
        # Advisory per-PR report: what THIS branch introduced, with file:line
        # and inline annotations. Never fails the job — the gate above decides
        # pass/fail — so a hint can never break a run the gate passes.
        if [ -n "$BASE_REF" ]; then
          echo "New STE findings introduced by this branch (advisory):"
          flags=(--changed-only --base "origin/${BASE_REF}")
          if [ "$ANNOTATIONS" = "true" ]; then flags+=(--annotations); fi
          node "$GITHUB_ACTION_PATH/ste-lint.mjs" "${flags[@]}"
        fi
