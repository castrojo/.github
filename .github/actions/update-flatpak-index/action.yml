name: "Update Flatpak OCI Index"
description: >-
  Synced implementation of update-index.py (canonical: tuna-os/flatpak-index/scripts/update-index.py).
  Reads a local OCI layout directory and updates a Flatpak index/static file with the
  published image's digest, architecture, and preserved labels (org.flatpak.* and
  org.freedesktop.appstream.*). Supports AppStream metadata validation to ensure
  software centres can display the application in their catalogues.
author: tuna-os

inputs:
  oci-dir:
    description: Path to the local OCI layout directory (must contain index.json)
    required: true
  index-file:
    description: Path to the index/static file to create or update
    required: false
    default: index/static
  repo-name:
    description: Repository name on the registry, e.g. tuna-os/tavern
    required: true
  registry:
    description: Registry host used to build the index's Registry field
    required: false
    default: ghcr.io
  tags:
    description: Space-separated list of tags for this image entry
    required: false
    default: latest
  require-appstream:
    description: Fail instead of warning when the image carries no AppStream metadata
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Update index
      shell: bash
      # Inputs travel through env, never through ${{ }} interpolation into the
      # script body. Actions substitutes expressions into the script TEXT before
      # bash parses it, so an interpolated value is parsed as shell — quoting
      # narrows that but does not close it, and `--tags` was unquoted outright
      # (deliberately, to word-split a multi-tag list), which made any caller
      # able to pass shell. As an env var the value is data, and `read -ra`
      # does the splitting the multi-tag case actually needs.
      env:
        ACTION_PATH: ${{ github.action_path }}
        OCI_DIR: ${{ inputs.oci-dir }}
        INDEX_FILE: ${{ inputs.index-file }}
        REPO_NAME: ${{ inputs.repo-name }}
        REGISTRY: ${{ inputs.registry }}
        TAGS: ${{ inputs.tags }}
        REQUIRE_APPSTREAM: ${{ inputs.require-appstream }}
      run: |
        set -euo pipefail

        # OCI tag grammar, so a malformed input is a clear error here rather
        # than a stray argument to update-index.py.
        read -ra tag_args <<<"$TAGS"
        if [ "${#tag_args[@]}" -eq 0 ]; then
          echo "::error::tags input is empty" >&2
          exit 1
        fi
        for tag in "${tag_args[@]}"; do
          if ! [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::invalid OCI tag: $tag" >&2
            exit 1
          fi
        done

        python3 "$ACTION_PATH/update-index.py" \
          --oci-dir "$OCI_DIR" \
          --index-file "$INDEX_FILE" \
          --repo-name "$REPO_NAME" \
          --registry "$REGISTRY" \
          --tags "${tag_args[@]}" \
          $([ "$REQUIRE_APPSTREAM" = "true" ] && echo "--require-appstream" || true)
