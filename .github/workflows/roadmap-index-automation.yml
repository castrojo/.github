name: Roadmap index refresh

# Keeps ROADMAP-INDEX.md in sync with live data (tunaos#1295). On a weekly
# schedule it checks whether the committed inventory matches the active repo
# set; if not, it rewrites the table and opens a pull request so the inventory
# can't go stale the way tunaos/ROADMAP.md's Community section did.

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch: {}

# Scheduled runs have no PR context, so this is `schedule` (never
# `pull_request_target` — tunaOS forbids it). The job pushes and opens a PR, so
# it needs write access to the repository contents.
permissions:
  contents: write

concurrency:
  group: roadmap-index-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Check the inventory against live data
        id: check
        run: |
          set -euo pipefail
          if python3 scripts/roadmap-index.py --check; then
            echo "The ROADMAP-INDEX table is up to date."
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh the table and open a PR on drift
        if: steps.check.outputs.drift == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: roadmap-index/refresh
          delete-branch: true
          commit-message: "docs: refresh ROADMAP-INDEX inventory"
          title: Refresh ROADMAP-INDEX inventory
          body: |
            Automated refresh of the org-wide ROADMAP inventory (tunaos#1295).

            `scripts/roadmap-index.py --check` detected drift between the
            committed `ROADMAP-INDEX.md` table and the live active-repo set.
            This PR rewrites the count, the "Last verified" date, and the
            table body; the surrounding prose is left untouched.
