name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Run the local-equivalent checks
        run: |
          # Install the project toolchain and just before enabling this template.
          just check

  # Enforces tuna-os/.github#12: major/minor Renovate updates must never
  # automerge. A syntactically valid renovate.json can still violate this
  # (see tuna-os/tunaOS#1612, tuna-os/tunaOS#1636) — this actually resolves
  # the rule layering instead of just checking JSON schema.
  renovate-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check Renovate automerge policy
        run: python3 scripts/check-renovate-automerge-policy.py renovate.json

  # Enforces tuna-os/.github#155: every workflow declares an explicit
  # top-level `permissions:` block (least privilege). This is the same check
  # that runs in tuna-os/.github itself; new repos inherit it by default.
  workflow-permissions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check workflow permissions
        run: python3 scripts/check-workflow-permissions.py .github/workflows

  # Make this the sole required branch-protection check. Add every mandatory
  # job to needs; optional E2E jobs must report success or skipped.
  required-checks:
    if: always()
    needs: [validate, renovate-policy, workflow-permissions]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if a required job did not succeed
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          failed=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result | IN("success", "skipped") | not) | .key')
          test -z "$failed" || { echo "Failed jobs: $failed"; exit 1; }
